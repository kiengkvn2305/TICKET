<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1, width=device-width" />
  <link rel="stylesheet" href="css/login.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ingrid+Darling:wght@400&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap" />
</head>
<body>
  <div class="login">
    <header class="header">
      <div class="header-child"></div>
      <div class="ticket-wrapper">
        <div class="ticket">TICKET</div>
      </div>
      <div class="frame-parent">
        <div class="bn-cn-tm-g-wrapper">
          <h3 class="bn-cn-tm">Bạn cần tìm gì</h3>
        </div>
        <input class="search-area" />
        <div class="dropdown">
          <button class="btn" onclick="toggleMenu(event)">
            <img class="image" src="assets/icons/DSC_0315.jpg" /> Tài khoản
          </button>
          <div id="menu" class="dropdown-content">
            <a href="#">Hồ sơ tài khoản</a>
            <a href="#">Đổi mật khẩu</a>
            <a href="#" onclick="logout()">Đăng xuất</a>
          </div>
        </div>
      </div>
    </header>

    <section class="rectangle-parent">
      <div class="action-buttons">
        <button type="button" onclick="loadTickets()">Quản lý phát hành vé</button>
        <button type="button" onclick="loadEvents()">Quản lý sự kiện</button>
        <button type="button" onclick="loadVouchers()">Quản lý khuyến mãi</button>
        <button type="button" onclick="followIncome()">Theo dõi doanh thu</button>
      </div>
    </section>

    <div class="content-area">
      <div id="ticketList"></div>
      <div id="eventList"></div>
      <div id="voucherList"></div>
    </div>
  </div>

  <!--
    Model  : api.js
    Guard  : authGuard.js
    View   : ui.js (popup, dropdown, clearContent, openCreate*)
    Controllers theo từng chức năng:
      - ticketList.js  → loadTickets, deleteTicket, editTicket
      - eventList.js   → loadEvents, deleteEvent, editEvent
      - voucherList.js → loadVouchers
  -->
  <script src="js/common/api.js"></script>
  <script src="js/common/authGuard.js"></script>
  <script src="js/common/ui.js"></script>
  <script src="js/ticket/ticketList.js"></script>
  <script src="js/event/eventList.js"></script>
  <script src="js/voucher/voucherList.js"></script>
  <script>
      function followIncome() {
          clearContent(); // xóa nội dung 3 div con, KHÔNG xóa bản thân chúng
          const ticketList = document.getElementById("ticketList");
          if (ticketList) {
              ticketList.innerHTML = `
                  <div style="text-align:center; padding:60px 20px; color:#888;">
                      <div style="font-size:3rem; margin-bottom:16px;">📊</div>
                      <h2 style="margin-bottom:8px;">Chức năng đang phát triển</h2>
                      <p>Tính năng theo dõi doanh thu sẽ được cập nhật sớm.</p>
                  </div>`;
          }
      }
  </script>
</html>
