<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Cập Nhật Vé</title>
  <link rel="stylesheet" href="css/Ve.css">
</head>
<body>
  <div class="container">
    <h1>Cập Nhật Vé</h1>

    <div class="form-group">
      <label>Tên vé</label>
      <input type="text" id="tenVe">
    </div>

    <div class="form-group">
      <label>Loại vé</label>
      <input type="text" id="loaiVe">
    </div>

    <div class="form-group">
      <label>Giá vé</label>
      <input type="number" id="gia">
    </div>

    <div class="form-group">
      <label>Trạng thái</label>
      <input type="text" id="trangThai">
    </div>

    <div class="form-group">
      <label>Mô tả</label>
      <textarea id="moTa"></textarea>
    </div>

    <div class="button-group">
      <button onclick="updateTicket()">Cập nhật vé</button>
      <button onclick="goBack()">Quay Lại</button>
    </div>
  </div>

  <!-- Model: api.js | Controller: editTicket.js -->
  <script src="js/common/api.js"></script>
  <script src="js/common/authGuard.js"></script>
  <script src="js/ticket/editTicket.js"></script>
</body>
</html>
