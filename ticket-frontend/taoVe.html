<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Tạo Vé</title>
  <link rel="stylesheet" href="css/Ve.css">
</head>
<body>
  <div class="container">
    <h1>Tạo Vé</h1>

    <div class="form-group">
      <label>Tên vé</label>
      <input type="text" id="tenVe">
    </div>

    <div class="form-group">
      <label>Loại vé</label>
      <input type="text" id="loaiVe">
    </div>

    <div class="form-group">
      <label>Giá vé</label>
      <input type="number" id="gia">
    </div>

    <div class="form-group">
      <label>Trạng thái</label>
      <input type="text" id="trangThai">
    </div>

    <div class="form-group">
      <label>Mô tả</label>
      <textarea id="moTa"></textarea>
    </div>

    <div class="form-group">
      <label>Sự kiện</label>
      <select id="maSuKien">
        <option value="">-- Chọn sự kiện --</option>
      </select>
    </div>

    <div class="button-group">
      <button onclick="createTicket()">Tạo Vé</button>
      <button onclick="goBack()">Quay Lại</button>
    </div>
  </div>

  <!-- Model: api.js | Controller: createTicket.js -->
  <script src="js/common/api.js"></script>
  <script src="js/ticket/createTicket.js"></script>
</body>
</html>
