<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tạo sự kiện</title>

    <link rel="stylesheet" href="css/createEvent.css">
</head>

<body>

    <div class="container">

        <h1>Tạo sự kiện</h1>

        <div class="form-group">

            <label>Tên sự kiện</label>

            <input
                type="text"
                id="tenSuKien"
                placeholder="Nhập tên sự kiện"
            >

        </div>

        <div class="form-group">

            <label>Mô tả</label>

            <textarea
                id="moTa"
                placeholder="Nhập mô tả"
            ></textarea>

        </div>

        <div class="form-group">

            <label>Thời gian bắt đầu</label>

            <input
                type="date"
                id="thoiGianBatDau"
            >

        </div>

        <div class="form-group">

            <label>Thời gian kết thúc</label>

            <input
                type="date"
                id="thoiGianKetThuc"
            >

        </div>

        <div class="button-group">

            <button
                class="create-btn"
                onclick="createEvent()"
            >
                Tạo sự kiện
            </button>

            <button
                class="cancel-btn"
                onclick="history.back()"
            >
                Hủy
            </button>

        </div>

    </div>

    <script src="js/script.js"></script>

</body>
</html>
