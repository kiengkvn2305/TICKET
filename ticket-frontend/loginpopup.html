<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />

    <link rel="stylesheet" href="css/loginpopup.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap"
    />
  </head>
  <body>
    <div class="container">
      <div class="login-box">
        <h2>Đăng nhập</h2>

        <div class="form-group">
          <label>Tên đăng nhập</label>
          <input type="text" id="username">
        </div>

        <div class="form-group">
          <label>Mật khẩu</label>
          <input type="password" id="password">
        </div>

        <div class="actions">
          <button class="btn-login" onclick="login()">Đăng nhập</button>
          <button class="btn-cancel" onclick="cancelLogin()">Hủy</button>
        </div>

        <div class="exception">
          <button class="btn-register" type="button" onclick="register()">
            Đăng ký
          </button>

          <button class="btn-forget" type="button" onclick="forget()">
            Quên mật khẩu
          </button>
        </div>
        
        <div id="overlay" onclick="closePopup()"></div>

      </div>

    </div>

    <script src="js/script.js"></script>
  </body>
</html>
